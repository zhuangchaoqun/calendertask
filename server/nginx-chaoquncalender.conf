server {
    listen 80;
    server_name 124.223.175.138;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Keep this endpoint on HTTP so existing 3.1 clients can make the
    # one-time transition to the certificate-pinned 3.2 release.
    location /chaoquncalender/updates/ {
        root /var/www/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 124.223.175.138;

    ssl_certificate /etc/letsencrypt/live/124.223.175.138/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/124.223.175.138/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
    }

    location /chaoquncalender/updates/ {
        root /var/www/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
