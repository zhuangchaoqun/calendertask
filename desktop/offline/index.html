<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>chaoquncalender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="widget">
    <header class="topbar">
      <button id="dragGrip" class="drag-grip" title="按住移动桌面日历">⠿ <span>拖动</span></button>
      <div class="brand"><small>CHAOQUNCALENDER · 离线版</small><strong id="todayTitle"></strong></div>
      <label class="search"><span>⌕</span><input id="searchInput" placeholder="搜索待办…"></label>
      <div class="actions">
        <span id="remaining" class="remaining"></span>
        <button id="prevMonth" title="上个月">‹</button>
        <button id="goToday" class="text-button">今天</button>
        <button id="nextMonth" title="下个月">›</button>
        <button id="addToday" title="新建今日待办">＋</button>
        <button id="openSettings" title="设置">⚙</button>
        <span class="window-actions"><button id="minimize" title="最小化">—</button><button id="close" title="关闭">×</button></span>
      </div>
    </header>
    <div id="monthLabel" class="month-label"></div>
    <div class="weekdays"><span>星期一</span><span>星期二</span><span>星期三</span><span>星期四</span><span>星期五</span><span>星期六</span><span>星期日</span></div>
    <div id="calendar" class="calendar"></div>
  </main>

  <dialog id="taskDialog">
    <form id="taskForm" class="panel">
      <div class="panel-head"><div><small id="editorMode">新建待办</small><h2 id="editorDateTitle">待办</h2></div><button type="button" data-close="taskDialog">×</button></div>
      <textarea id="taskTitle" required maxlength="160" placeholder="写下待办内容…"></textarea>
      <div class="field-grid"><label>日期<input id="taskDate" type="date" required></label><label>时间<input id="taskTime" type="time"></label></div>
      <div class="options">
        <label><input id="taskCompleted" type="checkbox"> 已完成</label>
        <label><input id="taskReminder" type="checkbox"> 提醒标记</label>
      </div>
      <fieldset class="colors"><legend>颜色</legend><label><input type="radio" name="color" value="blue" checked><i class="blue"></i></label><label><input type="radio" name="color" value="coral"><i class="coral"></i></label><label><input type="radio" name="color" value="green"><i class="green"></i></label><label><input type="radio" name="color" value="gold"><i class="gold"></i></label></fieldset>
      <div class="panel-actions"><button id="deleteTask" type="button" class="danger">删除</button><button id="duplicateTask" type="button">创建副本</button><span></span><button type="button" data-close="taskDialog">取消</button><button type="submit" class="primary">保存</button></div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <section class="panel settings-panel">
      <div class="panel-head"><div><small>CHAOQUNCALENDER</small><h2>本地桌面设置</h2></div><button type="button" data-close="settingsDialog">×</button></div>
      <div class="setting-card"><div><b>完全离线</b><p>待办只保存在这台电脑，不访问 chatgpt.site，也不需要 VPN 或账号。</p></div><span class="offline-badge">● 本地</span></div>
      <div class="setting-card column"><b>桌面组件</b><div class="button-grid"><button data-size="compact">紧凑</button><button data-size="standard">标准</button><button data-size="large">大号</button></div><div class="button-grid two"><button id="autoStart">开机启动</button><button id="alwaysTop">桌面置顶</button></div></div>
      <div class="setting-card column"><div class="setting-row"><div><b>透明度</b><p>调整整个桌面组件的透明程度</p></div><strong id="opacityValue">100%</strong></div><input id="opacity" type="range" min="45" max="100" step="5" value="100"></div>
      <div class="setting-card column"><b>本地备份与换电脑</b><p>不联网时，可导出 JSON 文件，通过 U 盘复制到另一台电脑再导入。</p><div class="button-grid two"><button id="exportBackup">导出备份</button><button id="importBackup">导入备份</button></div><p id="backupStatus" class="status"></p></div>
    </section>
  </dialog>

  <div class="resize n" data-edge="n"></div><div class="resize ne" data-edge="ne"></div><div class="resize e" data-edge="e"></div><div class="resize se" data-edge="se"></div><div class="resize s" data-edge="s"></div><div class="resize sw" data-edge="sw"></div><div class="resize w" data-edge="w"></div><div class="resize nw" data-edge="nw"></div>
  <script src="app.js"></script>
</body>
</html>
